<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>AutoApprove RPA</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 14px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    h2 {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 6px;
      font-size: 15px;
    }
    p {
      margin: 0 0 14px;
      font-size: 11px;
      line-height: 1.45;
      color: #94a3b8;
    }
    .btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 8px;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }
    .btn:hover { background: #1d4ed8; }
    .btn-sec {
      background: #1e293b;
      border: 1px solid #334155;
      color: #e2e8f0;
    }
    .btn-sec:hover { background: #334155; }
    .status {
      margin-top: 10px;
      padding: 8px;
      border-radius: 8px;
      background: #020617;
      font-size: 10px;
      color: #94a3b8;
      min-height: 14px;
    }
  </style>
</head>
<body>
  <h2>⚡ AutoApprove RPA</h2>
  <p>Automação e gravação de cliques para qualquer portal, usando a sessão já autenticada na sua aba.</p>

  <button id="btn-open-panel" class="btn" type="button">Abrir painel completo</button>
  <button id="btn-quick-run" class="btn btn-sec" type="button">▶️ Executar tarefa ativa</button>
  <button id="btn-quick-record" class="btn btn-sec" type="button">🔴 Gravar na tela</button>

  <div id="status-line" class="status">Pronto.</div>

  <script src="popup.js"></script>
</body>
</html>
